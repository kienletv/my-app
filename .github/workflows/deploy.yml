name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA commit cần deploy lại (rollback). Để trống = build commit hiện tại"
        required: false

# Không bao giờ chạy hai lần deploy cùng lúc; lần sau chờ lần trước xong.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kienletv/my-app # phải viết thường

jobs:
  build:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    # Chạy cả khi build bị bỏ qua (rollback), nhưng không chạy nếu build lỗi.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - name: Kiểm tra tag
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Tag phải là SHA đầy đủ 40 ký tự"; exit 1; }

      - name: Cài SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy lên VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd /opt/app \
            && export TAG=$TAG \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
